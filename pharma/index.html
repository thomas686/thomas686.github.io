<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pharma Flu Logistics Optimizer</title>
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css">
<style>
body{margin:0;background:#fff}
.bar{position:fixed;right:12px;bottom:12px;z-index:100000;display:flex;gap:12px;align-items:center;padding:8px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font:13px system-ui,Segoe UI,Arial,sans-serif;background:#120e24;color:#efeaf7}
.bar a{color:#7dffb0}
#boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;align-content:center;gap:18px;font:16px system-ui,Segoe UI,Arial,sans-serif;color:#444;text-align:center;padding:24px;background:#fff}
#boot b{font-size:22px;color:#120e24}
.spin{width:44px;height:44px;border:4px solid #e4e0f0;border-top-color:#6b4bd8;border-radius:50%;animation:s 1s linear infinite;margin:0 auto}
@keyframes s{to{transform:rotate(360deg)}}
[data-testid=stToolbar],[data-testid=stAppDeployButton],[data-testid=stMainMenu],[data-testid=stDecoration]{display:none!important}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><b>Pharma Flu Logistics Optimizer</b><span>Python is starting inside your browser, so nothing is installed or sent anywhere.<br>The first visit takes about a minute. Next time it is faster.</span><span id="elapsed">0 s</span></div>
<div id="root"></div>
<div class="bar"><span>Group project, Digital Innovation, MSc</span><a href="../?view=normal#work">&larr; Back to Thomas Sokolowski</a></div>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
const names = ["app.py", "clustering.py", "data_generator.py", "forecast.py", "metrics.py", "tooltip.py", "visualization.py"];
const files = Object.fromEntries(names.map(n => [n, { url: "./" + n }]));
mount({ requirements: ["plotly", "scikit-learn", "scipy"], entrypoint: "app.py", files }, document.getElementById("root"));
const t0 = Date.now(), el = document.getElementById("elapsed");
const iv = setInterval(() => { el.textContent = Math.round((Date.now() - t0) / 1000) + " s";
  if (document.querySelector("#root [data-testid=stSidebarNav], #root [data-testid=stMarkdownContainer]") || Date.now() - t0 > 300000) { document.getElementById("boot").remove(); clearInterval(iv); } }, 1000);
</script>
</body>
</html>
